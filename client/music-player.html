<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicMate - Music Player</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff4a3d;
            --secondary-color: #860b0d;
            --accent-color: #ff4a3d;
            --text-light: #ffffff;
            --text-dark: #191414;
            --text-muted: #b3b3b3;
            --gradient-primary: linear-gradient(45deg, #ff4a3d, #860b0d);
            --gradient-secondary: linear-gradient(135deg, rgba(255, 74, 61, 0.1), rgba(134, 11, 13, 0.1));
            --gradient-dark: linear-gradient(135deg, #434343 0%, #000000 100%);
            --shadow-light: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-medium: 0 8px 25px rgba(0, 0, 0, 0.15);
            --shadow-heavy: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        body {
            background: linear-gradient(to bottom, rgb(0,0,0,.95), rgba(100,0,40));
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Navigation Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 74, 61, 0.1);
            z-index: 1000;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        
        .navbar-brand i {
            color: #ff4a3d;
            font-size: 1.5rem;
        }
        
        .navbar-brand span {
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            color: #fff;
            background: rgba(255, 74, 61, 0.1);
            transform: translateY(-2px);
        }
        
        .nav-link.active {
            color: #ff4a3d;
            background: rgba(255, 74, 61, 0.1);
        }
        
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .btn-login {
            background: linear-gradient(45deg, #ff4a3d, #860b0d);
            color: white;
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 74, 61, 0.3);
            color: white;
        }
        
        .logo {
            width: 55vw;
            height: 15vh;
            display: flex;
            align-items: center;
        }
        
        .sitelogo {
            color: #0e3742;
            font-family: 'Neonderthaw', cursive;    
            margin-left: 2rem;
            font-size: 50px;
            text-decoration: none;
            animation: animate 3s linear infinite;
        }
        
        @keyframes animate {
            0%,20%,40%,50%,80%,99% {
                color: #0e3742;
                text-shadow: none;
            }
            100%,20%,40%,45.1%,60%,86%,0% {
                color: #fff;
                text-shadow: 0 0 10px #ff4a3d,
                0 0 20px #ff4a3d,
                0 0 40px #ff4a3d,
                0 0 80px #ff4a3d,
                0 0 100px #030303;
            }
        }
        
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 15vh;
            gap: 2rem;
        }
        
        .navitems {
            text-decoration: none;
            color: gray;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-family: 'Tilt Neon', cursive;
            transition: .8s ease-in-out;
            padding: 0.5rem 1rem;
        }
        
        .navitems:hover {
            color: white;
            transform: scale(1.03);
            transition: .2s ease-in;
            text-shadow: 0 0 10px #ff4a3d,
            0 0 20px #ff4a3d,
            0 0 40px #ff4a3d,
            0 0 80px #ff4a3d,
            0 0 100px #030303;
        }
        
        .profilepic {
            height: 10vh;
            border-radius: 50%;
            margin-left: 1rem;
            transition: all 0.3s ease;
        }
        
        .profilepic:hover {
            transform: scale(1.02);
            box-shadow: 8px 0px 120px 1px #ff4a3d;
        }
        
        .main-container {
            padding: 120px 2rem 2rem;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .player-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .player-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }
        
        .album-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-heavy);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }
        
        .album-art {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(255, 74, 61, 0.3);
            transition: all 0.3s ease;
            border: 4px solid rgba(255, 74, 61, 0.2);
        }
        
        .album-art.playing {
            animation: spin 10s linear infinite;
            box-shadow: 0 20px 40px rgba(255, 74, 61, 0.5);
            border-color: #ff4a3d;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .song-info h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .song-info p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        
        .progress-container {
            margin: 2rem 0;
        }
        
        .progress {
            height: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #ff4a3d, #860b0d);
            transition: width 0.1s ease;
            border-radius: 10px;
        }
        
        .progress:hover .progress-bar {
            background: linear-gradient(45deg, #ff6b5b, #a00c0e);
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .control-btn:hover {
            background: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
        }
        
        .play-btn {
            width: 80px;
            height: 80px;
            font-size: 2rem;
            background: var(--primary-color);
        }
        
        .play-btn:hover {
            background: linear-gradient(45deg, #ff6b5b, #a00c0e);
            transform: translateY(-3px) scale(1.05);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        .playlist-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 600px;
            overflow-y: auto;
        }
        
        .playlist-items {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .playlist-items::-webkit-scrollbar {
            width: 6px;
        }
        
        .playlist-items::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .playlist-items::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }
        
        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: between;
            margin-bottom: 2rem;
        }
        
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(10px);
        }
        
        .playlist-item.active {
            background: rgba(255, 74, 61, 0.2);
            border-left: 4px solid var(--primary-color);
            border-radius: 15px 15px 15px 0;
        }
        
        .playlist-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 1rem;
        }
        
        .playlist-info h6 {
            margin: 0;
            font-weight: 600;
        }
        
        .playlist-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .playlist-duration {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .genre-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .genre-tab {
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .genre-tab:hover,
        .genre-tab.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }
        
        .visualizer {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 3px;
            height: 50px;
            margin: 1rem 0;
        }
        
        .bar {
            width: 4px;
            background: var(--primary-color);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }
        
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
        
        @media (max-width: 1024px) {
            .player-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .player-content {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }
        
        @media (max-width: 768px) {
            .album-art {
                width: 250px;
                height: 250px;
            }
            
            .player-controls {
                gap: 1rem;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            
            .play-btn {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            
            .main-container {
                padding: 120px 1rem 1rem;
            }
        }
    </style>
</head>

    <!-- Main Container -->

        <div class="player-layout">

            <div class="player-section">
                <div class="player-card">

                        <div class="controls-section">

                                        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>

                                    <div class="time-display">
                                        <span id="current-time">0:00</span>
                                        <span id="total-time">0:00</span>
                                    </div>
                                </div>
                                
                                <!-- Player Controls -->
                                <div class="player-controls">
                                    <button class="control-btn" id="shuffle-btn" title="Shuffle">
                                        <i class="fas fa-random"></i>
                                    </button>
                                    <button class="control-btn" id="prev-btn" onclick="prevSong()" title="Previous">
                                        <i class="fas fa-step-backward"></i>

                                    <button class="control-btn" id="next-btn" onclick="nextSong()" title="Next">

                                    <button class="control-btn" id="repeat-btn" title="Repeat">

                                    </button>
                                </div>
                                
                                <!-- Volume Control -->
                                <div class="volume-control">
                                    <i class="fas fa-volume-down"></i>
                                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="50">
                                    <i class="fas fa-volume-up"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Playlist -->
            <div class="playlist-wrapper">
                <div class="playlist-section">
                    <div class="playlist-header">
                        <h4><i class="fas fa-list me-2"></i>Now Playing</h4>
                        <button class="btn btn-sm btn-outline-light">
                            <i class="fas fa-ellipsis-h"></i>
                        </button>
                    </div>
                    
                    <div class="playlist-items" id="playlistContainer">
                        <!-- Playlist will be dynamically generated by JavaScript -->
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" preload="metadata"></audio>
    
    <!-- Background Effects -->
    <div id="blur"></div>
    <div id="blob"></div>

        // Player elements
        const audioPlayer = document.getElementById("audio-player");
        const albumArt = document.getElementById("album-art");
        const songTitle = document.getElementById("song-title");
        const songArtist = document.getElementById("song-artist");
        const playBtn = document.getElementById("play-btn");

        const shuffleBtn = document.getElementById("shuffle-btn");

        let currentSongIndex = 0;
        let isPlaying = false;
        let isShuffled = false;
        let isRepeated = false;

        // Generate playlist HTML
        function generatePlaylist() {
            const playlistContainer = document.getElementById('playlistContainer');
            playlistContainer.innerHTML = '';
            
            songs.forEach((song, index) => {
                const playlistItem = document.createElement('div');
                playlistItem.className = `playlist-item ${index === currentSongIndex ? 'active' : ''}`;
                playlistItem.onclick = () => changeSong(index);
                
                playlistItem.innerHTML = `
                    <img src="${song.image}" alt="${song.title}" class="playlist-img">
                    <div class="playlist-info">
                        <h6>${song.title}</h6>
                        <p>${song.artist}</p>
                    </div>
                    <div class="playlist-duration">${song.duration}</div>
                `;
                
                playlistContainer.appendChild(playlistItem);
            });
        }

        // Initialize player
        function initPlayer() {
            generatePlaylist();
            loadSong(currentSongIndex);
            setupEventListeners();
            updatePlaylistHighlight();
        }

        // Load song
        function loadSong(index) {
            const song = songs[index];
            audioPlayer.src = song.file;
            albumArt.src = song.image;
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            totalTimeEl.textContent = song.duration;
            currentSongIndex = index;
            updatePlaylistHighlight();
        }

        // Play/Pause functionality
        function playPauseSong() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                albumArt.classList.add('playing');
                startVisualizer();
                isPlaying = true;
            } else {
                audioPlayer.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                albumArt.classList.remove('playing');
                stopVisualizer();
                isPlaying = false;
            }
        }

        // Previous song
        function prevSong() {
            let index;
            if (isShuffled) {
                index = Math.floor(Math.random() * songs.length);
            } else {
                index = (currentSongIndex - 1 + songs.length) % songs.length;
            }
            loadSong(index);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        // Next song
        function nextSong() {
            let index;
            if (isShuffled) {
                index = Math.floor(Math.random() * songs.length);
            } else {
                index = (currentSongIndex + 1) % songs.length;
            }
            loadSong(index);
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        // Change song from playlist
        function changeSong(index) {
            if (index === currentSongIndex && !audioPlayer.paused) {
                playPauseSong();
            } else {
                loadSong(index);
                playPauseSong();
            }
        }

        // Update playlist highlight
        function updatePlaylistHighlight() {
            const playlistItems = document.querySelectorAll('.playlist-item');
            playlistItems.forEach((item, index) => {
                if (index === currentSongIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Format time
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Update progress
        function updateProgress() {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                
                // Update total time when metadata is loaded
                if (totalTimeEl.textContent === '0:00') {
                    totalTimeEl.textContent = formatTime(audioPlayer.duration);
                }
            }
        }

        // Visualizer animation
        function startVisualizer() {
            const bars = visualizer.querySelectorAll('.bar');
            bars.forEach(bar => {
                bar.style.animationPlayState = 'running';
            });
        }

        function stopVisualizer() {
            const bars = visualizer.querySelectorAll('.bar');
            bars.forEach(bar => {
                bar.style.animationPlayState = 'paused';
            });
        }

        // Toggle shuffle
        function toggleShuffle() {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active', isShuffled);
            if (isShuffled) {
                shuffleBtn.style.color = 'var(--primary-color)';
            } else {
                shuffleBtn.style.color = '';
            }
        }

        // Toggle repeat
        function toggleRepeat() {
            isRepeated = !isRepeated;
            repeatBtn.classList.toggle('active', isRepeated);
            if (isRepeated) {
                repeatBtn.style.color = 'var(--primary-color)';
            } else {
                repeatBtn.style.color = '';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Audio events
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', () => {
                if (isRepeated) {
                    audioPlayer.currentTime = 0;
                    audioPlayer.play();
                } else {
                    nextSong();
                }
            });
            audioPlayer.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audioPlayer.duration);
            });

            // Volume control
            volumeSlider.addEventListener('input', (e) => {
                audioPlayer.volume = e.target.value / 100;
            });

            // Progress bar click
            const progressContainer = progressBar.parentElement;
            progressContainer.addEventListener('click', (e) => {
                if (audioPlayer.duration) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const width = rect.width;
                    const percentage = Math.max(0, Math.min(1, clickX / width));
                    audioPlayer.currentTime = percentage * audioPlayer.duration;
                    updateProgress();
                }
            });
            
            // Progress bar hover effect
            progressContainer.addEventListener('mousemove', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const hoverX = e.clientX - rect.left;
                const width = rect.width;
                const percentage = Math.max(0, Math.min(1, hoverX / width));
                
                // Show preview time on hover (optional enhancement)
                if (audioPlayer.duration) {
                    const previewTime = percentage * audioPlayer.duration;
                    progressContainer.title = formatTime(previewTime);
                }
            });

            // Control buttons
            shuffleBtn.addEventListener('click', toggleShuffle);
            repeatBtn.addEventListener('click', toggleRepeat);

            // Genre tabs
            document.querySelectorAll('.genre-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.genre-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                });
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    switch(e.code) {
                        case 'Space':
                            e.preventDefault();
                            playPauseSong();
                            break;
                        case 'ArrowLeft':
                            prevSong();
                            break;
                        case 'ArrowRight':
                            nextSong();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            volumeSlider.value = Math.min(100, parseInt(volumeSlider.value) + 10);
                            audioPlayer.volume = volumeSlider.value / 100;
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            volumeSlider.value = Math.max(0, parseInt(volumeSlider.value) - 10);
                            audioPlayer.volume = volumeSlider.value / 100;
                            break;
                    }
                }
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initPlayer);

        // Console message
        console.log('🎵 MusicMate Player Loaded! 🎵');
        console.log('Keyboard shortcuts:');
        console.log('Space - Play/Pause');
        console.log('← → - Previous/Next');
        console.log('↑ ↓ - Volume Up/Down');
    </script>
</body>
</html>
